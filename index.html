<title>Barber & Beauty</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;

  font-family: Arial, sans-serif;
}

body {
  background: #0b0b0b;

}

header {
  text-align: center;

  font-size: 32px;

  margin-top: 8px;
}

  max-width: 900px;

  padding: 35px 20px;
}

.hero {
  text-align: center;
  margin-bottom: 35px;
}

  font-size: 32px;

}

<header>
  <h1>BARBER & BEAUTY</h1>

</header>

<main class="container">

<section class="hero">
  <h2>Programează-te online</h2>
  <p>Alege serviciul, ziua și ora.</p>
</section>


<!-- SERVICII -->

<section class="services">

  <div class="service">
    <h3>💈 Tuns</h3>
    <div class="price">450 MDL</div>
  </div>

  <div class="service">
    <h3>🧔 Barbă</h3>
    <div class="price">300 MDL</div>

  <div class="service">
    <h3>🤟🏻 Tonare barbă</h3>
    <div class="price">250 MDL</div>
  </div>

  <div class="service">
    <h3>👁️ Sprâncene</h3>
    <div class="price">200 MDL</div>
  </div>

  <div class="service">
    <h3>👑 Complex</h3>
    <div class="price">1000 MDL</div>
  </div>

</section>


<!-- PROGRAMARE -->

<section class="booking">

<h2>Fă o programare</h2>


<label for="service">Serviciu</label>

<select id="service">

  <option value="Tuns|450 MDL">
    💈 Tuns — 450 MDL
  </option>

  <option value="Barbă|300 MDL">
    🧔 Barbă — 300 MDL
  </option>

  <option value="Tonare barbă|250 MDL">
    🤟🏻 Tonare barbă — 250 MDL
  </option>

  <option value="Sprâncene|200 MDL">
    👁️ Sprâncene — 200 MDL
  </option>

  <option value="Complex|1000 MDL">
    👑 Complex — 1000 MDL
  </option>

</select>


<label for="day">Ziua</label>

<select id="day">

  <option value="Luni">Luni</option>
  <option value="Marți">Marți</option>
  <option value="Miercuri">Miercuri</option>
  <option value="Joi">Joi</option>
  <option value="Vineri">Vineri</option>
  <option value="Sâmbătă">Sâmbătă</option>
  <option value="Duminică">Duminică</option>

</select>


<label for="time">Ora</label>

<select id="time">

  <option value="08:00">08:00</option>
  <option value="09:00">09:00</option>
  <option value="10:00">10:00</option>
  <option value="11:00">11:00</option>
  <option value="12:00">12:00</option>
  <option value="13:00">13:00</option>
  <option value="14:00">14:00</option>
  <option value="15:00">15:00</option>
  <option value="16:00">16:00</option>
  <option value="17:00">17:00</option>
  <option value="18:00">18:00</option>
  <option value="19:00">19:00</option>
  <option value="20:00">20:00</option>
  <option value="21:00">21:00</option>

</select>


<label for="name">Nume</label>

<input
  id="name"
  type="text"
  placeholder="Numele tău"
  autocomplete="name"
>


<label for="phone">Telefon</label>

<input
  id="phone"
  type="tel"
  placeholder="Numărul de telefon"
  autocomplete="tel"
>


<button id="bookingButton" onclick="makeBooking()">
  PROGRAMEAZĂ-TE
</button>


<div id="message"></div>

</section>

</main>


<footer>
© 2026 Barber & Beauty
</footer>


<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyFP_-JIdRA5KxpNRmdW8_z4nfaQV9PHwC_jWWKKioehyEJp5Ap7zEjMdQEFrfSn28F/exec";


async function makeBooking() {

  const name =
    document.getElementById("name").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const serviceValue =
    document.getElementById("service").value;

  const day =
    document.getElementById("day").value;

  const time =
    document.getElementById("time").value;

  const message =
    document.getElementById("message");

  const button =
    document.getElementById("bookingButton");


  /* VERIFICARE NUME ȘI TELEFON */

  if (name === "" || phone === "") {

    message.style.display = "block";
    message.style.background = "#4a1c1c";
    message.style.color = "#ffbaba";

    message.innerText =
      "Te rugăm să completezi numele și numărul de telefon.";

    return;
  }


  /* SEPARĂM SERVICIUL DE PREȚ */

  const serviceParts =
    serviceValue.split("|");

  const service =
    serviceParts[0];

  const price =
    serviceParts[1];


  /* DATELE CARE VOR AJUNGE ÎN GOOGLE SHEETS */

  const bookingData = {

    name: name,

    phone: phone,

    service: service,

    price: price,

    day: day,

    time: time

  };


  button.disabled = true;
  button.innerText = "SE TRIMITE...";


  message.style.display = "block";
  message.style.background = "#173d20";
  message.style.color = "#b9f6c5";

  message.innerText =
    "Se trimite programarea...";


  try {

    await fetch(
      SCRIPT_URL,
      {
        method: "POST",

        mode: "no-cors",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body: JSON.stringify(bookingData)
      }
    );


    /*
    PROGRAMAREA A FOST TRIMISĂ
    */

    message.style.background = "#173d20";
    message.style.color = "#b9f6c5";

    message.innerText =
      "✅ Programarea a fost trimisă!\n\n" +
      name +
      " — " +
      service +
      " — " +
      price +
      "\n" +
      day +
      " la " +
      time;


    /*
    CURĂȚĂM NUMELE ȘI TELEFONUL
    */

    document.getElementById("name").value = "";

    document.getElementById("phone").value = "";


  } catch (error) {

    console.error(error);

    message.style.background = "#4a1c1c";
    message.style.color = "#ffbaba";

    message.innerText =
      "❌ Nu s-a putut trimite programarea. Încearcă din nou.";

  }


  button.disabled = false;
  button.innerText = "PROGRAMEAZĂ-TE";

}

</script>

</body>
</html>
