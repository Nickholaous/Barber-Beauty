<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Barber & Beauty</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #0b0b0b;
  color: white;
}

header {
  text-align: center;
  padding: 35px 20px;
  border-bottom: 1px solid #292929;
}

header h1 {
  font-size: 32px;
  letter-spacing: 2px;
}

header p {
  color: #999;
  margin-top: 8px;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 35px 20px;
}

.hero {
  text-align: center;
  margin-bottom: 35px;
}

.hero h2 {
  font-size: 32px;
  margin-bottom: 10px;
}

.hero p {
  color: #aaa;
}

.services {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 15px;
  margin-bottom: 35px;
}

.service {
  background: #151515;
  border: 1px solid #292929;
  border-radius: 16px;
  padding: 25px 15px;
  text-align: center;
}

.service h3 {
  margin-bottom: 10px;
}

.price {
  font-size: 21px;
  font-weight: bold;
}

.booking {
  background: #151515;
  border: 1px solid #292929;
  border-radius: 18px;
  padding: 25px;
}

.booking h2 {
  text-align: center;
  margin-bottom: 20px;
}

label {
  display: block;
  margin: 15px 0 7px;
  color: #ccc;
}

select,
input {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #333;
  background: #0b0b0b;
  color: white;
  font-size: 16px;
}

button {
  width: 100%;
  margin-top: 22px;
  padding: 15px;
  border: 0;
  border-radius: 10px;
  background: white;
  color: black;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #ddd;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

#message {
  display: none;
  margin-top: 18px;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
}

footer {
  text-align: center;
  padding: 30px;
  color: #777;
}
</style>
</head>

<body>

<header>
  <h1>BARBER & BEAUTY</h1>
  <p>Stil. Precizie. Încredere.</p>
</header>

<main class="container">

<section class="hero">
  <h2>Programează-te online</h2>
  <p>Alege serviciul, ziua și ora.</p>
</section>

<section class="services">

  <div class="service">
    <h3>💈 Tuns</h3>
    <div class="price">450 MDL</div>
  </div>

  <div class="service">
    <h3>🧔 Barbă</h3>
    <div class="price">300 MDL</div>
  </div>

  <div class="service">
    <h3>Tonare barbă</h3>
    <div class="price">250 MDL</div>
  </div>

  <div class="service">
    <h3>👁️ Sprâncene</h3>
    <div class="price">200 MDL</div>
  </div>

</section>

<section class="booking">

<h2>Fă o programare</h2>

<label for="service">Serviciu</label>

<select id="service">
  <option value="Tuns">💈 Tuns — 450 MDL</option>
  <option value="Barbă">🧔 Barbă — 300 MDL</option>
  <option value="Tonare barbă">Tonare barbă — 250 MDL</option>
  <option value="Sprâncene">👁️ Sprâncene — 200 MDL</option>
</select>

<label for="day">Ziua</label>

<select id="day">
  <option value="Luni">Luni</option>
  <option value="Marți">Marți</option>
  <option value="Miercuri">Miercuri</option>
  <option value="Joi">Joi</option>
  <option value="Vineri">Vineri</option>
  <option value="Sâmbătă">Sâmbătă</option>
  <option value="Duminică">Duminică</option>
</select>

<label for="time">Ora</label>

<select id="time">
  <option value="08:00">08:00</option>
  <option value="09:00">09:00</option>
  <option value="10:00">10:00</option>
  <option value="11:00">11:00</option>
  <option value="12:00">12:00</option>
  <option value="13:00">13:00</option>
  <option value="14:00">14:00</option>
  <option value="15:00">15:00</option>
  <option value="16:00">16:00</option>
  <option value="17:00">17:00</option>
  <option value="18:00">18:00</option>
  <option value="19:00">19:00</option>
  <option value="20:00">20:00</option>
  <option value="21:00">21:00</option>
</select>

<label for="name">Nume</label>

<input
  id="name"
  type="text"
  placeholder="Numele tău"
>

<label for="phone">Telefon</label>

<input
  id="phone"
  type="tel"
  placeholder="Numărul de telefon"
>

<button id="bookingButton" onclick="makeBooking()">
  PROGRAMEAZĂ-TE
</button>

<div id="message"></div>

</section>

</main>

<footer>
© 2026 Barber & Beauty
</footer>

<script>

async function makeBooking() {

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const service = document.getElementById("service").value;
  const day = document.getElementById("day").value;
  const time = document.getElementById("time").value;

  const message = document.getElementById("message");
  const button = document.getElementById("bookingButton");

  if (name === "" || phone === "") {

    message.style.display = "block";
    message.style.background = "#4a1c1c";
    message.style.color = "#ffbaba";

    message.innerText =
      "Te rugăm să completezi numele și numărul de telefon.";

    return;
  }

  button.disabled = true;
  button.innerText = "SE TRIMITE...";

  message.style.display = "block";
  message.style.background = "#173d20";
  message.style.color = "#b9f6c5";

  message.innerText = "Se trimite programarea...";

  try {

    await fetch(
      "https://script.google.com/macros/s/AKfycbyFP_-JIdRA5KxpNRMdW8_z4nfaQV9PHwC_jWWKKioehyEJp5Ap7zEjMdQEFrfSn28F/exec",
      {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain"
        },
        body: JSON.stringify({
          name: name,
          phone: phone,
          service: service,
          day: day,
          time: time
        })
      }
    );

    message.style.background = "#173d20";
    message.style.color = "#b9f6c5";

    message.innerText =
      "Programarea a fost trimisă! " +
      name + " — " +
      service + ", " +
      day + " la " +
      time + ".";

    document.getElementById("name").value = "";
    document.getElementById("phone").value = "";

  } catch (error) {

    message.style.background = "#4a1c1c";
    message.style.color = "#ffbaba";

    message.innerText =
      "Nu s-a putut trimite programarea. Încearcă din nou.";

  }

  button.disabled = false;
  button.innerText = "PROGRAMEAZĂ-TE";
}

</script>

</body>
</html>
